<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <style>
        /* Global Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        h1 {
            font-size: 3em;
            animation: slideIn 1.5s ease-out;
            margin: 0;
        }

        p {
            font-size: 1.5em;
            margin-top: 10px;
            text-align: center;
            animation: fadeIn 2.5s ease-in;
        }

        button {
            padding: 15px 30px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 20px;
            animation: bounce 2s infinite;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #27ae60;
        }

        .balloon {
            position: absolute;
            width: 50px;
            height: 70px;
            background: radial-gradient(circle, #ff6f61, #c0392b);
            border-radius: 50%;
            animation: float 5s ease-in-out infinite;
        }

        .balloon:before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            width: 2px;
            height: 20px;
            background: #fff;
            transform: translateX(-50%);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            50% {
                transform: translateY(50vh) rotate(45deg);
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>🎉 Selamat Ulang Tahun, Zumrotus Sholihah F. 🌸!</h1>
    <p>Semoga tahun ini penuh kebahagiaan, kesehatan, dan kesuksesan!  
       Semangat yaa cari jodohnya, wkwk. 😄</p>
    <button id="showMessage">Klik untuk Pesan Spesial 🎁</button>

    <!-- JavaScript -->
    <script>
        // Generate balloons dynamically
        for (let i = 0; i < 20; i++) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.left = Math.random() * 100 + 'vw';
            balloon.style.animationDuration = Math.random() * 3 + 4 + 's';
            balloon.style.background = radial-gradient(circle, hsl(${Math.random() * 360}, 70%, 70%), hsl(${Math.random() * 360}, 50%, 50%));
            document.body.appendChild(balloon);
        }

        // Button interaction
        document.getElementById('showMessage').addEventListener('click', () => {
            alert('🎂 Zumrotus Sholihah F., Happy Birthday! Semoga harimu luar biasa!');
        });
    </script>
</body>
</html>
